<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inference Lab Schedule</title>
<style>
:root {
  --bg: #f6f7fb; --panel: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
  --accent: #1e40af; --accent-soft: #dbeafe; --ok: #047857; --ok-soft: #d1fae5;
  --warn: #b45309; --warn-soft: #fef3c7; --bad: #b91c1c; --bad-soft: #fee2e2;
  --hol: #fdf2d0; --chip: #f1f5f9; --today: #2563eb; --shadow: 0 1px 2px rgb(15 23 42 / .06), 0 1px 8px rgb(15 23 42 / .04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1020; --panel: #121a2b; --ink: #e5e7eb; --muted: #94a3b8; --line: #23304a;
    --accent: #93c5fd; --accent-soft: #1e3a8a55; --ok: #34d399; --ok-soft: #064e3b88;
    --warn: #fbbf24; --warn-soft: #78350f66; --bad: #f87171; --bad-soft: #7f1d1d66;
    --hol: #3a2f0f; --chip: #1c2740; --today: #60a5fa; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1020; --panel: #121a2b; --ink: #e5e7eb; --muted: #94a3b8; --line: #23304a;
  --accent: #93c5fd; --accent-soft: #1e3a8a55; --ok: #34d399; --ok-soft: #064e3b88;
  --warn: #fbbf24; --warn-soft: #78350f66; --bad: #f87171; --bad-soft: #7f1d1d66;
  --hol: #3a2f0f; --chip: #1c2740; --today: #60a5fa; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 2px 0 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.card .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card .v { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.card .s { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.banner { border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; border: 1px solid; }
.banner.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.banner.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.banner.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.banner b { color: inherit; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 9px 12px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-color: var(--accent); font-weight: 600; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.pad { padding: 14px; }
.muted { color: var(--muted); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.gpu { background: #ede9fe; color: #6d28d9; }
.pill.mac { background: var(--chip); color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.gpu { background: #4c1d9566; color: #c4b5fd; } }
:root[data-theme="dark"] .pill.gpu { background: #4c1d9566; color: #c4b5fd; }
input[type="number"], input[type="date"] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
input[type="number"] { width: 64px; }
input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--ok); cursor: pointer; flex: none; }
button.b { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.b:hover { border-color: var(--accent); }
button.b.danger { color: var(--bad); }
button.link { background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }

/* Tasks */
.phase { margin-bottom: 14px; overflow: hidden; }
.phase-h { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.phase-h .name { font-weight: 650; display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.phase-h .meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.task { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: start; }
.task:last-child { border-bottom: 0; }
.task.done .title { text-decoration: line-through; color: var(--muted); }
.task.cut { opacity: .5; }
.task .title { font-weight: 550; }
.task .id { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; font-weight: 500; }
.kid { font-size: 13px; margin-top: 3px; }
.task .crit { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.task .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; color: var(--muted); text-align: right; }
.task .nums { display: flex; gap: 8px; align-items: center; }
.task .nums label { display: flex; gap: 4px; align-items: center; }

/* Day by day */
.week { margin-bottom: 12px; overflow: hidden; }
.week-h { padding: 9px 14px; font-weight: 600; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.day { display: grid; grid-template-columns: 112px 1fr; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.day:last-child { border-bottom: 0; }
.day.hol { background: var(--hol); }
.day.past { opacity: .72; }
.day.today { box-shadow: inset 3px 0 0 var(--today); background: var(--accent-soft); }
.day .d { font-weight: 600; font-variant-numeric: tabular-nums; }
.day .d small { display: block; font-weight: 400; color: var(--muted); }
.chunk { display: flex; gap: 8px; align-items: flex-start; padding: 2px 0; }
.chunk .h { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
.flag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--bad); margin: 2px 0; }
.flag.met { color: var(--ok); }

/* Timeline */
.tl { padding: 14px; }
.tl-row { display: grid; grid-template-columns: 230px 1fr; gap: 10px; align-items: center; margin: 6px 0; }
.tl-label { font-size: 12.5px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.tl-label .pill { flex: none; }
.tl-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { position: relative; height: 26px; background: var(--chip); border-radius: 6px; overflow: hidden; }
.track .hol { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, var(--hol), var(--hol) 4px, transparent 4px, transparent 8px); }
.track .base { position: absolute; top: 4px; bottom: 4px; border: 1.5px dashed var(--muted); border-radius: 5px; opacity: .7; }
.track .proj { position: absolute; top: 7px; bottom: 7px; border-radius: 4px; }
.track .dl { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); }
.track .now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--today); z-index: 2; }
.axis { position: relative; height: 18px; font-size: 11px; color: var(--muted); }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

/* Settings */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.field { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.field:last-child { border-bottom: 0; }
.wd { display: flex; gap: 6px; flex-wrap: wrap; }
.wd label { display: flex; gap: 4px; align-items: center; font-size: 12.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.tag { background: var(--chip); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }
.tag button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; }
h3 { font-size: 14px; margin: 0 0 6px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.empty { padding: 18px 14px; color: var(--muted); }

@media (max-width: 640px) {
  .tl-row { grid-template-columns: 1fr; gap: 3px; }
  .day { grid-template-columns: 1fr; gap: 4px; }
  .task { grid-template-columns: 22px 1fr; }
  .task .side { grid-column: 2; align-items: flex-start; text-align: left; }
}
</style>
</head>

  <main id="view"></main>
</div>

  // Phase 1
  { id: "1.0", p: "P1", h: 1.5, where: "mac", t: "Roadmap reading: KV-cache part of Gordić's 'Inside vLLM'", c: "Notes: block table, free-block queue, reference counts, eviction", o: "You can explain how vLLM keeps the AI's memory in small boxes." },

  s.ui = s.ui || { tab: "today" };
  return migrate(s);
}
// A new plan version moves the start date and rebuilds the frozen deadlines
// from the new task list. Ticked tasks, logged hours and edited estimates are kept.
function to150(s) {
  s.settings.overrides = { ...SPRINT150.table };
  s.settings.hoursPerDay = SPRINT150.hoursAfter;
  s.settings.workdays = [false, true, true, true, true, true, true];
  s.tasks = s.tasks || {};
  for (const id of SPRINT150.cut) { const o = (s.tasks[id] = s.tasks[id] || {}); if (!o.done) o.cut = true; }
  for (const [id, h] of Object.entries(SPRINT150.est)) { const o = (s.tasks[id] = s.tasks[id] || {}); if (o.est == null) o.est = h; }
  for (const id of SPRINT150.done) { const o = (s.tasks[id] = s.tasks[id] || {}); if (!o.done) { o.done = true; o.doneOn = '2026-10-12'; } }
}
function migrate(s) {
  if (s.planVersion !== PLAN_VERSION && (s.planVersion || 0) < 3) to150(s);
  if (!s.baseline || s.planVersion !== PLAN_VERSION) {
    if (s.planVersion !== PLAN_VERSION) s.settings.start = DEFAULT_SETTINGS.start;
    s.baseline = computeBaseline(s.settings, s.tasks || {});
    s.planVersion = PLAN_VERSION;
  }
  return s;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast("Couldn't save in this browser. Use Export to keep a backup."); }
}

const task = id => TASKS.find(t => t.id === id);
const tstate = id => (state.tasks[id] = state.tasks[id] || {});
const est = t => { const o = state.tasks[t.id]; return o && o.est != null ? o.est : t.h; };
const logged = id => state.logs.filter(l => l.id === id).reduce((a, l) => a + l.h, 0);
const isDone = id => !!(state.tasks[id] && state.tasks[id].done);
const isCut = id => !!(state.tasks[id] && state.tasks[id].cut);
const today = () => state.settings.asOf || toKey(new Date());

/* ======================================================================
   SCHEDULER
   Tasks run in order; each day's capacity is filled greedily and tasks may
   split across days. Unfinished work is always re-planned from today.
   ====================================================================== */
function capacity(settings, k) {
  if (settings.holidays.includes(k)) return 0;
  if (settings.overrides[k] != null) return Number(settings.overrides[k]);
  if (!settings.workdays[fromKey(k).getDay()]) return 0;
  return Number(settings.hoursPerDay);
}

function plan(settings, items, from, usedOn = {}) {
  const byTask = {}, byDay = {};
  let day = from, left = Math.max(0, capacity(settings, day) - (usedOn[day] || 0)), guard = 0, finish = null, stuck = false;
  for (const it of items) {
    let rem = it.rem;
    const rec = { start: null, end: null, chunks: [] };
    while (rem > 1e-9 && !stuck) {
      while (left <= 1e-9) {
        day = addDays(day, 1);
        left = Math.max(0, capacity(settings, day) - (usedOn[day] || 0));
        if (++guard > 1500) { stuck = true; break; }
      }
      if (stuck) break;
      const h = Math.min(rem, left);
      rec.chunks.push({ date: day, h });
      (byDay[day] = byDay[day] || []).push({ id: it.id, h });
      rec.start = rec.start || day;
      rec.end = day;
      rem -= h; left -= h;
    }
    byTask[it.id] = rec;
    finish = maxKey(finish, rec.end);
  }
  return { byTask, byDay, finish, stuck };
}

function computeBaseline(settings, tstates = {}) {
  const e = t => (tstates[t.id] && tstates[t.id].est != null ? tstates[t.id].est : t.h);
  const items = TASKS.filter(t => !(tstates[t.id] && tstates[t.id].cut)).map(t => ({ id: t.id, rem: e(t) }));
  const p = plan(settings, items, settings.start);
  const phase = {};
  for (const ph of PHASES) {
    const ts = TASKS.filter(t => t.p === ph.id).map(t => p.byTask[t.id]).filter(Boolean);
    phase[ph.id] = { start: ts.reduce((a, r) => minKey(a, r.start), null), end: ts.reduce((a, r) => maxKey(a, r.end), null) };
  }
  const taskEnd = Object.fromEntries(TASKS.map(t => [t.id, p.byTask[t.id] ? p.byTask[t.id].end : null]));
  const final = TASKS.filter(isLab).reduce((a, t) => maxKey(a, p.byTask[t.id] && p.byTask[t.id].end), null);
  return { phase, taskEnd, final, finalAll: p.finish, createdOn: toKey(new Date()), totalHours: TASKS.filter(t => isLab(t) && !(tstates[t.id] && tstates[t.id].cut)).reduce((a, t) => a + e(t), 0) };
}

function project() {
  const s = state.settings, now = today();
  const from = maxKey(s.start, now);
  const usedOn = {};
  for (const l of state.logs) if (l.date >= from) usedOn[l.date] = (usedOn[l.date] || 0) + l.h;
  const items = TASKS.filter(t => !isDone(t.id) && !isCut(t.id)).map(t => {
    const r = est(t) - logged(t.id);
    return { id: t.id, rem: r > 1e-9 ? r : 0.5, over: r <= 1e-9 };
  });
  const p = plan(s, items, from, usedOn);
  p.items = items;
  const phase = {};
  for (const ph of PHASES) {
    const ts = TASKS.filter(t => t.p === ph.id && !isCut(t.id));
    const open = ts.filter(t => !isDone(t.id));
    const doneDates = ts.filter(t => isDone(t.id)).map(t => state.tasks[t.id].doneOn).filter(Boolean);
    const logDates = state.logs.filter(l => ts.some(t => t.id === l.id)).map(l => l.date);
    let end = open.reduce((a, t) => maxKey(a, p.byTask[t.id] && p.byTask[t.id].end), null);
    if (!end) end = doneDates.reduce(maxKey, null);
    let start = logDates.reduce(minKey, null);
    start = minKey(start, open.reduce((a, t) => minKey(a, p.byTask[t.id] && p.byTask[t.id].start), null));
    const totalH = ts.reduce((a, t) => a + est(t), 0);
    const doneH = ts.reduce((a, t) => a + (isDone(t.id) ? est(t) : Math.min(logged(t.id), est(t))), 0);
    phase[ph.id] = { start, end, totalH, doneH, complete: open.length === 0 && ts.length > 0 };
  }
  const labItems = items.filter(i => isLab(task(i.id)));
  const remaining = labItems.reduce((a, i) => a + i.rem, 0);
  const finish = labItems.reduce((a, i) => maxKey(a, p.byTask[i.id] && p.byTask[i.id].end), null)
    || TASKS.filter(t => isLab(t) && isDone(t.id)).map(t => state.tasks[t.id].doneOn).reduce(maxKey, null);
  const finishAll = maxKey(p.finish, finish);
  // Days with capacity between today and the hard deadline.
  let capToDeadline = 0, daysToDeadline = 0;
  for (let k = from; k <= state.baseline.final; k = addDays(k, 1)) {
    const c = Math.max(0, capacity(s, k) - (usedOn[k] || 0));
    if (c > 0 || (!s.holidays.includes(k) && s.workdays[fromKey(k).getDay()])) daysToDeadline++;
    capToDeadline += c;
  }
  return { ...p, phase, remaining, finish, finishAll, capToDeadline, daysToDeadline, from };
}

/* ======================================================================
   ACTIONS
   ====================================================================== */
function setDone(id, val) {
  const o = tstate(id), t = task(id);
  if (val) {
    o.done = true; o.doneOn = today();
    const rem = est(t) - logged(id);
    if (rem > 1e-9) state.logs.push({ id, date: today(), h: rem, auto: true });
  } else {
    o.done = false; delete o.doneOn;
    state.logs = state.logs.filter(l => !(l.id === id && l.auto));
  }
  commit(val ? `Done: ${id}` : `Reopened ${id}`);
}
function setLogged(id, total) {
  const cur = logged(id);
  const d = Math.round((total - cur) * 100) / 100;
  if (Math.abs(d) > 1e-9) state.logs.push({ id, date: today(), h: d });
  commit();
}
function setEst(id, v) { const t = task(id); const o = tstate(id); if (v === t.h) delete o.est; else o.est = v; commit(); }
function toggleCut(id) { const o = tstate(id); o.cut = !o.cut; commit(o.cut ? `Cut ${id} from scope` : `Restored ${id}`); }
function commit(msg) { save(); render(); if (msg) toast(msg); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 1800);
}

/* ======================================================================
   RENDER
   ====================================================================== */
const TABS = [["today", "Today"], ["timeline", "Timeline"], ["days", "Day by day"], ["tasks", "Tasks"], ["settings", "Settings"]];
let P;

function render() {
  P = project();
  renderHeader();
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = TABS.map(([k, l]) => `<button class="${state.ui.tab === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("");
  const v = document.getElementById("view");
  v.innerHTML = ({ today: viewToday, timeline: viewTimeline, days: viewDays, tasks: viewTasks, settings: viewSettings })[state.ui.tab]();
  if (state.ui.tab === "days") { const el = document.querySelector(".day.today"); if (el && !render.scrolled) { el.scrollIntoView({ block: "center" }); render.scrolled = true; } }
}

function renderHeader() {
  const s = state.settings, B = state.baseline, now = today();
  const scope = TASKS.filter(t => isLab(t) && !isCut(t.id));
  const total = scope.reduce((a, t) => a + est(t), 0);
  const done = scope.reduce((a, t) => a + (isDone(t.id) ? est(t) : Math.min(logged(t.id), est(t))), 0);
  const pct = total ? Math.round((done / total) * 100) : 0;
  const nDone = scope.filter(t => isDone(t.id)).length;
  const slip = P.finish ? diffDays(B.final, P.finish) : 0;
  const need = P.daysToDeadline ? P.remaining / P.daysToDeadline : Infinity;
  const gpuH = scope.filter(t => t.where === "gpu" && !isDone(t.id)).reduce((a, t) => a + Math.max(0, est(t) - logged(t.id)), 0);

  document.getElementById("sub").textContent =
    `Starts ${fmt(s.start)} · ${s.hoursPerDay}h/day · holidays ${s.holidays.length ? fmtShort(s.holidays[0]) + "–" + fmtShort(s.holidays[s.holidays.length - 1]) : "none"} · as of ${fmt(now)}${s.asOf ? " (simulated)" : ""}`;

  const statusCls = P.stuck ? "bad" : slip > 0 ? "bad" : slip === 0 ? "warn" : "ok";
  const statusTxt = P.stuck ? "Can't schedule" : slip > 0 ? `${slip}d late` : slip === 0 ? "No slack" : `${-slip}d ahead`;
  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="k">Progress</div><div class="v">${pct}%</div><div class="s">${nDone}/${scope.length} tasks · ${hrs(done)} of ${hrs(total)}</div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="card"><div class="k">Hard deadline</div><div class="v">${fmtShort(B.final)}</div><div class="s">${fmt(B.final)} · baseline</div></div>
    <div class="card"><div class="k">Projected finish</div><div class="v">${fmtShort(P.finish)}</div><div class="s"><span class="pill ${statusCls}">${statusTxt}</span></div></div>
    <div class="card"><div class="k">Required pace</div><div class="v">${isFinite(need) ? hrs(need) + "/day" : "—"}</div><div class="s">${hrs(P.remaining)} left over ${P.daysToDeadline} working days</div></div>
    <div class="card"><div class="k">GPU work left</div><div class="v">${hrs(gpuH)}</div><div class="s">billable session time (approx.)</div></div>`;

  const late = TASKS.filter(t => !isDone(t.id) && !isCut(t.id) && state.baseline.taskEnd[t.id] < now);
  let html = "";
  if (P.stuck) html = `<div class="banner bad"><b>No working capacity.</b> Check hours/day and workdays in Settings.</div>`;
  else if (slip > 0) {
    const extra = need - s.hoursPerDay;
    html = `<div class="banner bad"><b>Behind by ${slip} day${slip > 1 ? "s" : ""}.</b> To still finish by ${fmt(B.final)} you need about <b>${hrs(need)}/day</b>${extra > 0 ? ` (+${hrs(extra)}/day)` : ""}, or cut optional work / use buffer tasks. ${late.length} task${late.length === 1 ? " is" : "s are"} past their baseline date.</div>`;
  } else if (late.length) html = `<div class="banner warn"><b>${late.length} task${late.length === 1 ? " is" : "s are"} past their baseline date</b>, but the overall finish still holds thanks to buffers.</div>`;
  else html = `<div class="banner ok"><b>On track.</b> ${slip < 0 ? `${-slip} day${slip < -1 ? "s" : ""} of slack before the hard deadline.` : "Exactly on the baseline."}</div>`;
  document.getElementById("banner").innerHTML = html;
}

function phaseOf(id) { return PHASES.find(p => p.id === id); }
function wherePill(w) { return `<span class="pill ${w}">${w === "gpu" ? "GPU" : "Mac"}</span>`; }

function taskLine(t, h, opts = {}) {
  const done = isDone(t.id);
  return `<div class="chunk">
    <input type="checkbox" data-done="${t.id}" ${done ? "checked" : ""} aria-label="Mark ${esc(t.id)} done">
    <div><span class="dot" style="display:inline-block;background:${phaseOf(t.p).color};margin-right:6px"></span><span class="muted">${esc(t.id)}</span> ${done ? `<s class="muted">${esc(t.t)}</s>` : esc(t.t)} ${opts.pill ? wherePill(t.where) : ""}
      ${opts.crit && t.o ? `<div class="kid"><b>Outcome:</b> ${esc(t.o)}</div>` : ""}
      ${opts.crit ? `<div class="muted" style="font-size:12.5px">Done when: ${esc(t.c)}</div>` : ""}</div>
    ${h != null ? `<span class="h">${hrs(h)}</span>` : ""}</div>`;
}

function viewToday() {
  const now = today(), cap = capacity(state.settings, now);
  const chunks = (P.byDay[now] || []);
  const doneToday = TASKS.filter(t => isDone(t.id) && state.tasks[t.id].doneOn === now);
  const loggedToday = state.logs.filter(l => l.date === now).reduce((a, l) => a + l.h, 0);
  let next = [];
  for (let k = addDays(now, 1), n = 0; n < 4 && k <= (P.finishAll || now); k = addDays(k, 1)) {
    if (P.byDay[k]) { next.push(k); n++; }
  }
  const deadlinesSoon = PHASES.filter(ph => { const d = state.baseline.phase[ph.id].end; return d >= now && diffDays(now, d) <= 7 && !P.phase[ph.id].complete; });
  return `
  <div class="grid2">
    <section class="panel pad">
      <h3>${fmt(now)} ${state.settings.holidays.includes(now) ? '<span class="pill warn">Holiday</span>' : ""}</h3>
      <p class="muted" style="margin:0 0 10px">${now < state.settings.start ? "Before the start date" : `Capacity ${hrs(cap)} · logged ${hrs(loggedToday)}`}</p>
      ${chunks.length ? chunks.map(c => taskLine(task(c.id), c.h, { pill: true, crit: true })).join("") : `<p class="muted">${now < state.settings.start ? `Nothing yet. Work starts ${fmt(state.settings.start)}.` : cap === 0 ? "Rest day." : "Nothing left planned today."}</p>`}
      ${doneToday.length ? `<h3 style="margin-top:14px">Completed today</h3>${doneToday.map(t => taskLine(t, null)).join("")}` : ""}
    </section>
    <section class="panel pad">
      <h3>Coming up</h3>
      ${next.length ? next.map(k => `<div style="margin-bottom:8px"><div class="muted" style="font-size:12px;font-weight:600">${fmt(k)}</div>${P.byDay[k].map(c => taskLine(task(c.id), c.h)).join("")}</div>`).join("") : '<p class="muted">Nothing scheduled.</p>'}
      ${deadlinesSoon.length ? `<h3 style="margin-top:12px">Deadlines within 7 days</h3>${deadlinesSoon.map(ph => {
        const s = diffDays(state.baseline.phase[ph.id].end, P.phase[ph.id].end);
        return `<div class="chunk"><span class="dot" style="background:${ph.color};margin-top:5px"></span><div>${esc(ph.name)}<div class="muted" style="font-size:12px">due ${fmt(state.baseline.phase[ph.id].end)} · projected ${fmt(P.phase[ph.id].end)}</div></div><span class="h"><span class="pill ${s > 0 ? "bad" : "ok"}">${s > 0 ? s + "d late" : "on time"}</span></span></div>`;
      }).join("")}` : ""}
    </section>
  </div>`;
}

function viewTimeline() {
  const B = state.baseline, s = state.settings, now = today();
  const start = s.start;
  const end = addDays(maxKey(B.finalAll || B.final, P.finishAll), 2);
  const span = diffDays(start, end) + 1;
  const pct = k => (diffDays(start, k) / span) * 100;
  const w = (a, b) => ((diffDays(a, b) + 1) / span) * 100;
  // contiguous holiday ranges
  const hol = [...s.holidays].sort(); const ranges = [];
  for (const h of hol) { const r = ranges[ranges.length - 1]; if (r && addDays(r[1], 1) === h) r[1] = h; else ranges.push([h, h]); }
  const holHtml = ranges.filter(r => r[1] >= start && r[0] <= end).map(r => `<div class="hol" style="left:${pct(maxKey(r[0], start))}%;width:${w(maxKey(r[0], start), minKey(r[1], end))}%"></div>`).join("");
  const nowHtml = now >= start && now <= end ? `<div class="now" style="left:${pct(now)}%"></div>` : "";
  // axis ticks every Monday
  let ticks = ""; for (let k = start; k <= end; k = addDays(k, 1)) if (fromKey(k).getDay() === 1) ticks += `<span style="left:${pct(k)}%">${fmtShort(k)}</span>`;

  const rows = PHASES.map(ph => {
    const b = B.phase[ph.id], p = P.phase[ph.id];
    const slip = p.end ? diffDays(b.end, p.end) : 0;
    const pctDone = p.totalH ? Math.round((p.doneH / p.totalH) * 100) : 0;
    const proj = p.start && p.end ? `<div class="proj" style="left:${pct(maxKey(p.start, start))}%;width:${w(maxKey(p.start, start), p.end)}%;background:${ph.color}"></div>` : "";
    return `<div class="tl-row">
      <div class="tl-label"><span class="dot" style="background:${ph.color}"></span><span title="${esc(ph.name)}">${esc(ph.name.replace(/^Phase /, "P"))}</span>
        <span class="pill ${p.complete ? "ok" : slip > 0 ? "bad" : ""}" style="margin-left:auto">${p.complete ? "done" : slip > 0 ? "+" + slip + "d" : pctDone + "%"}</span></div>
      <div class="track">${holHtml}<div class="base" style="left:${pct(b.start)}%;width:${w(b.start, b.end)}%"></div>${proj}<div class="dl" style="left:calc(${pct(b.end) + w(b.end, b.end)}% - 1px)" title="Deadline ${fmt(b.end)}"></div>${nowHtml}</div>
    </div>`;
  }).join("");

  const table = PHASES.map(ph => {
    const b = B.phase[ph.id], p = P.phase[ph.id];
    const slip = p.end ? diffDays(b.end, p.end) : 0;
    return `<tr><td><span class="dot" style="display:inline-block;background:${ph.color};margin-right:6px"></span>${esc(ph.name)}</td><td>${esc(ph.where)}</td><td>${hrs(p.totalH)}</td><td>${fmt(b.start)}</td><td><b>${fmt(b.end)}</b></td><td>${fmt(p.end)}</td><td><span class="pill ${p.complete ? "ok" : slip > 0 ? "bad" : "ok"}">${p.complete ? "complete" : slip > 0 ? slip + "d late" : slip < 0 ? -slip + "d early" : "on time"}</span></td></tr>`;
  }).join("");

  return `<section class="panel tl">
    <div class="tl-row"><div></div><div class="axis">${ticks}</div></div>
    ${rows}
    <div class="legend"><span><i style="border:1.5px dashed var(--muted)"></i>Baseline plan</span><span><i style="background:var(--accent)"></i>Projected (live)</span><span><i style="background:var(--bad);width:3px"></i>Hard deadline</span><span><i style="background:var(--today);width:3px"></i>Today</span><span><i style="background:repeating-linear-gradient(45deg,var(--hol),var(--hol) 3px,transparent 3px,transparent 6px)"></i>Holiday</span></div>
  </section>
  <section class="panel" style="margin-top:14px;overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em">${["Phase", "Where", "Hours", "Starts", "Hard deadline", "Projected", "Status"].map(h => `<th style="padding:10px 12px;border-bottom:1px solid var(--line)">${h}</th>`).join("")}</tr></thead>
      <tbody>${table.replace(/<td>/g, '<td style="padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap">')}</tbody>
    </table>
  </section>`;
}

function viewDays() {
  const s = state.settings, B = state.baseline, now = today();
  const end = maxKey(B.finalAll || B.final, P.finishAll);
  const deadlinesOn = {};
  for (const ph of PHASES) (deadlinesOn[B.phase[ph.id].end] = deadlinesOn[B.phase[ph.id].end] || []).push(ph);
  // Start weeks on Monday.
  let first = s.start; while (fromKey(first).getDay() !== 1) first = addDays(first, -1);
  let html = "", weekNo = 0;
  for (let wk = first; wk <= end; wk = addDays(wk, 7)) {
    weekNo++;
    let days = "", planned = 0;
    for (let i = 0; i < 7; i++) {
      const k = addDays(wk, i);
      if (k < s.start || k > end) continue;
      const cap = capacity(s, k), isHol = s.holidays.includes(k);
      const past = k < now, isToday = k === now;
      let body = "";
      if (past || isToday) {
        const byId = {};
        for (const l of state.logs.filter(l => l.date === k)) byId[l.id] = (byId[l.id] || 0) + l.h;
        body += Object.entries(byId).filter(([, h]) => h > 1e-9).map(([id, h]) => taskLine(task(id), h)).join("");
      }
      if (!past) {
        const ch = P.byDay[k] || [];
        planned += ch.reduce((a, c) => a + c.h, 0);
        body += ch.map(c => taskLine(task(c.id), c.h)).join("");
      }
      if (deadlinesOn[k]) body += deadlinesOn[k].map(ph => {
        const met = P.phase[ph.id].complete && P.phase[ph.id].end <= k;
        return `<div class="flag ${met ? "met" : ""}">⚑ Deadline: ${esc(ph.name)}${met ? " · met" : ""}</div>`;
      }).join("");
      if (k === B.final) body += `<div class="flag">⚑ Hard deadline: project complete</div>`;
      if (!body) body = `<span class="muted">${isHol ? "Holiday" : cap === 0 ? "Rest day" : past ? "Nothing logged" : "Free"}</span>`;
      days += `<div class="day ${isHol ? "hol" : ""} ${past ? "past" : ""} ${isToday ? "today" : ""}"><div class="d">${fmt(k)}<small>${isHol ? "holiday" : hrs(cap) + " capacity"}${isToday ? " · today" : ""}</small></div><div>${body}</div></div>`;
    }
    html += `<section class="panel week"><div class="week-h"><span>Week ${weekNo} · ${fmtShort(maxKey(wk, s.start))} – ${fmtShort(minKey(addDays(wk, 6), end))}</span><span class="muted" style="font-weight:400">${hrs(planned)} planned</span></div>${days}</section>`;
  }
  return html;
}

function viewTasks() {
  return PHASES.map(ph => {
    const b = state.baseline.phase[ph.id], p = P.phase[ph.id];
    const slip = p.end ? diffDays(b.end, p.end) : 0;
    const rows = TASKS.filter(t => t.p === ph.id).map(t => {
      const done = isDone(t.id), cut = isCut(t.id), r = P.byTask[t.id];
      const lg = logged(t.id), e = est(t);
      const late = !done && !cut && r && r.end > state.baseline.taskEnd[t.id];
      return `<div class="task ${done ? "done" : ""} ${cut ? "cut" : ""}">
        <input type="checkbox" data-done="${t.id}" ${done ? "checked" : ""} ${cut ? "disabled" : ""} aria-label="Mark ${esc(t.id)} done">
        <div><div class="title"><span class="id">${esc(t.id)}</span>${esc(t.t)} ${wherePill(t.where)} ${t.opt ? '<span class="pill warn">optional</span>' : ""} ${lg > e + 1e-9 && !done ? '<span class="pill bad">over estimate</span>' : ""}</div>
          ${t.o ? `<div class="kid"><b>Outcome:</b> ${esc(t.o)}</div>` : ""}
          <div class="crit">Done when: ${esc(t.c)}</div></div>
        <div class="side">
          <div class="nums"><label>est <input type="number" min="0" step="0.5" value="${e}" data-est="${t.id}"></label><label>spent <input type="number" step="0.5" value="${Math.round(lg * 10) / 10}" data-log="${t.id}"></label></div>
          <div>${done ? `done ${fmt(state.tasks[t.id].doneOn)}` : cut ? "cut from scope" : r ? `${fmtShort(r.start)} → <b>${fmtShort(r.end)}</b>` : ""} · due ${fmtShort(state.baseline.taskEnd[t.id])} ${late ? '<span class="pill bad">late</span>' : ""}</div>
          <button class="link" data-cut="${t.id}">${cut ? "restore" : "cut from scope"}</button>
        </div></div>`;
    }).join("");
    return `<section class="panel phase">
      <div class="phase-h"><div class="name"><span class="dot" style="background:${ph.color}"></span>${esc(ph.name)}</div>
        <div class="meta"><span>${hrs(p.doneH)} / ${hrs(p.totalH)}</span><span>deadline <b>${fmt(b.end)}</b></span><span>projected ${fmt(p.end)}</span><span class="pill ${p.complete ? "ok" : slip > 0 ? "bad" : "ok"}">${p.complete ? "complete" : slip > 0 ? slip + "d late" : "on time"}</span></div></div>
      ${rows}</section>`;
  }).join("");
}

function viewSettings() {
  const s = state.settings;
  const ov = Object.entries(s.overrides).sort();
  return `<div class="grid2">
    <section class="panel pad">
      <h3>Capacity</h3>
      <div class="field"><span>Start date</span><input type="date" value="${s.start}" data-set="start"></div>
      <div class="field"><span>Hours per day</span><input type="number" min="0" max="16" step="0.5" value="${s.hoursPerDay}" data-set="hoursPerDay"></div>
      <div class="field" style="align-items:flex-start"><span>Working days</span><div class="wd">${[1, 2, 3, 4, 5, 6, 0].map(i => `<label><input type="checkbox" data-wd="${i}" ${s.workdays[i] ? "checked" : ""}>${DOW[i]}</label>`).join("")}</div></div>
      <div class="field"><span>As-of date <span class="muted">(simulate a different “today”)</span></span><span><input type="date" value="${s.asOf}" data-set="asOf"> ${s.asOf ? '<button class="link" data-clear-asof>clear</button>' : ""}</span></div>
    </section>
    <section class="panel pad">
      <h3>Holidays</h3>
      <div class="tags">${s.holidays.length ? [...s.holidays].sort().map(h => `<span class="tag">${fmt(h)}<button data-rmhol="${h}" aria-label="Remove">×</button></span>`).join("") : '<span class="muted">None</span>'}</div>
      <div class="field"><span>Add holiday</span><input type="date" data-addhol></div>
      <h3 style="margin-top:14px">Day overrides</h3>
      <p class="muted" style="margin:0 0 6px;font-size:12.5px">Set a different number of hours for one date (e.g. 2h on a busy day, 8h on a weekend push).</p>
      <div class="tags">${ov.length ? ov.map(([d, h]) => `<span class="tag">${fmt(d)}: ${hrs(Number(h))}<button data-rmov="${d}" aria-label="Remove">×</button></span>`).join("") : '<span class="muted">None</span>'}</div>
      <div class="field"><span><input type="date" id="ovd"> <input type="number" id="ovh" min="0" max="16" step="0.5" value="0"></span><button class="b" data-addov>Add</button></div>
    </section>
    <section class="panel pad">
      <h3>Baseline (hard deadlines)</h3>
      <p class="muted" style="margin:0 0 8px;font-size:12.5px">Deadlines are frozen from the plan created on ${fmt(state.baseline.createdOn)}: final deadline <b>${fmt(state.baseline.final)}</b>. Changing settings re-plans the projection, not the deadlines. Re-baseline only for a deliberate scope or schedule change.</p>
      <button class="b danger" data-rebase>Re-baseline deadlines from the current settings</button>
    </section>
    <section class="panel pad">
      <h3>Data</h3>
      <p class="muted" style="margin:0 0 8px;font-size:12.5px">Progress is saved in this browser only. Export a backup now and then, especially before clearing browser data or switching machines.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" data-export>Export JSON</button><label class="b" style="display:inline-flex;align-items:center">Import JSON<input type="file" accept="application/json" data-import hidden></label><button class="b danger" data-reset>Reset everything</button></div>
    </section>
  </div>`;
}

/* ======================================================================
   EVENTS
   ====================================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-tab],[data-cut],[data-rmhol],[data-rmov],[data-addov],[data-rebase],[data-export],[data-reset],[data-clear-asof]");
  if (!el) return;
  const d = el.dataset;
  if (d.tab) { state.ui.tab = d.tab; render.scrolled = false; save(); render(); }
  else if (d.cut) toggleCut(d.cut);
  else if (d.rmhol) { state.settings.holidays = state.settings.holidays.filter(h => h !== d.rmhol); commit("Holiday removed"); }
  else if (d.rmov) { delete state.settings.overrides[d.rmov]; commit("Override removed"); }
  else if ("addov" in d) {
    const date = document.getElementById("ovd").value, h = parseFloat(document.getElementById("ovh").value);
    if (!date || !(h >= 0)) return toast("Pick a date and hours");
    state.settings.overrides[date] = h; commit(`Override set for ${fmt(date)}`);
  }
  else if ("rebase" in d) { if (confirm("Replace the frozen deadlines with a new plan from the current settings and estimates?")) { state.baseline = computeBaseline({ ...state.settings }); rebaseFromCurrent(); commit("Deadlines re-baselined"); } }
  else if ("export" in d) {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `inference-lab-schedule-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
  }
  else if ("reset" in d) { if (confirm("Delete all progress, settings and the baseline in this browser?")) { try { localStorage.removeItem(KEY); } catch (_) {} state = load(); render(); toast("Reset"); } }
  else if ("clearAsof" in d) { state.settings.asOf = ""; commit(); }
});

document.addEventListener("change", e => {
  const el = e.target, d = el.dataset;
  if (d.done) setDone(d.done, el.checked);
  else if (d.est) { const v = parseFloat(el.value); if (v >= 0) setEst(d.est, v); }
  else if (d.log) { const v = parseFloat(el.value); if (!isNaN(v)) setLogged(d.log, v); }
  else if (d.set) {
    const v = d.set === "hoursPerDay" ? parseFloat(el.value) : el.value;
    if (d.set === "hoursPerDay" && !(v >= 0)) return;
    if (d.set === "start" && !v) return;
    state.settings[d.set] = v; commit();
  }
  else if (d.wd) { state.settings.workdays[+d.wd] = el.checked; commit(); }
  else if ("addhol" in d) { if (el.value && !state.settings.holidays.includes(el.value)) { state.settings.holidays.push(el.value); state.settings.holidays.sort(); commit(`Holiday added: ${fmt(el.value)}`); } }
  else if ("import" in d) {
    const f = el.files[0]; if (!f) return;
    f.text().then(txt => {
      const s = JSON.parse(txt);
      if (!s || !s.settings || !s.baseline) throw new Error("not a schedule export");
      state = migrate(s); save(); render(); toast("Imported");
    }).catch(err => toast("Import failed: " + err.message));
  }
});

// Re-baselining from the current state keeps estimates the user edited.
function rebaseFromCurrent() {
  state.baseline = computeBaseline(state.settings, state.tasks);
}

// Roll the plan over at midnight if the page stays open.
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);

render();
</script>
</body>
</html>
