[project]
name = "llm-inference-performance"
version = "0.1.0"
description = "GPU and LLM inference performance engineering lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Result analysis and plots.
analysis = ["pandas>=2.2", "matplotlib>=3.9"]
# Local (Mac / CPU / MPS) model execution. The CUDA torch build for the GPU box
# is installed separately so its CUDA version matches the driver there.
torch = ["torch>=2.5", "transformers>=4.46", "accelerate>=1.0"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
